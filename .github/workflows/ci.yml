name: Build, Test, and Publish

on:
  push:
    tags:
      - "v*"  # Trigger pipeline on version tag push
  pull_request:
    branches:
      - master
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-20.04

    steps:
    # 0. Print All Env Vars
    - name: List All Environment Variables
      run: env  

    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Workaround: Disable SSL Verification (Fix for `act`)
    - name: Disable SSL Verification (Temporary)
      run: |
        export NODE_TLS_REJECT_UNAUTHORIZED=0
        export CURL_CA_BUNDLE=""
        sudo mkdir -p /etc/apt/apt.conf.d
        echo 'Acquire::https::Verify-Peer "false";' | sudo tee /etc/apt/apt.conf.d/99verify-peer
        echo 'Acquire::https::Verify-Host "false";' | sudo tee -a /etc/apt/apt.conf.d/99verify-peer

    # ✅ Fix Python Installation in `act`
    - name: Install Python (Only for act)
      if: env.ACT == 'true'
      run: |
        sudo apt update --allow-insecure-repositories || sudo apt update
        sudo apt install -y software-properties-common
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt update
        sudo apt install -y python3.10 python3.10-venv python3.10-dev python3.10-distutils
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
        python3 --version
        curl -sS https://bootstrap.pypa.io/get-pip.py | python3.10
        pip3 --version

    # ✅ Use GitHub's Python setup when running in GitHub Actions
    - name: Set up Python
      if: env.ACT != 'true'
      uses: actions/setup-python@v4
      with:
        python-version: 3.10.0  

    # 3. Install dependencies with Poetry
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install

    - name: Install project package
      run: |
        poetry run pip install -e .  

    # 4. Run tests with coverage
    - name: Run tests with coverage
      run: |
        export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE/src"
        poetry run pytest --cov=src --cov-report=xml --cov-report=term

    # 5. Lint the code
    - name: Lint code
      run: poetry run flake8 src || echo "Lint warnings detected."

    # 6. Upload coverage report
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.xml
